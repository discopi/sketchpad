<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sketchpad</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --ink:#2a2826; --muted:#8a857f; --line:#e7e3de; --soft:#f2efeb; --accent:#3d6fd1; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#f9f9f9;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color:var(--ink);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  canvas#c { position:fixed; inset:0; touch-action:none; display:block; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; touch-action:manipulation; }

  #bar { position:fixed; top:0; left:0; right:0; z-index:5; display:flex; align-items:flex-end; gap:16px;
    padding:calc(env(safe-area-inset-top) + 6px) max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left));
    background:rgba(255,255,255,.96); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
  #bar::-webkit-scrollbar { display:none; }
  .group { display:flex; flex-direction:column; gap:4px; flex:none; }
  .lbl { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding-left:2px; }
  .sw { display:flex; gap:7px; }
  .swatch { width:32px; height:32px; border-radius:50%; position:relative; box-shadow:inset 0 0 0 1px rgba(0,0,0,.14); }
  .swatch.cur::after { content:""; position:absolute; left:50%; bottom:-6px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:var(--muted); }
  .swatch.on { outline:2.5px solid var(--ink); outline-offset:2.5px; }
  .swatch.on::after { background:var(--ink); }
  .swatch-add { width:32px; height:32px; border-radius:50%; border:1.5px dashed #c9c4be; color:var(--muted); display:grid; place-items:center; }
  .swatch-add svg { width:16px; height:16px; }
  #hexdel[hidden] { display:none; }
  .sep { width:1px; align-self:stretch; background:var(--line); flex:none; margin:2px 0; }
  .icons { display:flex; gap:4px; flex:none; }
  .ib { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; flex:none; }
  .ib svg { width:22px; height:22px; }
  .ib.on { background:var(--ink); color:#fff; }
  .ib:disabled { opacity:.3; }
  .spacer { flex:1; min-width:4px; }
  #clear.warn { background:#c94a3b; color:#fff; width:auto; padding:0 12px; font-size:14px; }

  #sub { position:fixed; z-index:4; left:max(14px, env(safe-area-inset-left)); display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:6px 8px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 4px 14px rgba(0,0,0,.06); font-size:14px; max-width:calc(100% - 28px); }
  #sub[hidden] { display:none; }
  .sl { color:var(--muted); font-size:12px; padding:0 2px 0 4px; }
  .hint { color:var(--muted); padding:4px 6px; }
  .seg { display:flex; background:var(--soft); border-radius:8px; padding:2px; }
  .seg button { padding:6px 11px; border-radius:6px; font-size:14px; }
  .seg button.on { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.12); font-weight:600; }
  .pill { padding:7px 12px; border-radius:8px; background:var(--soft); font-size:14px; }
  .pill.on { background:var(--ink); color:#fff; }
  .pill.danger { color:#b23b2e; }
  .vdiv { width:1px; height:24px; background:var(--line); margin:0 2px; }

  .pop { position:fixed; z-index:10; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.14); padding:14px; }
  .pop[hidden] { display:none; }
  .row { display:flex; gap:8px; align-items:center; }
  .row + .row { margin-top:10px; }
  #hexin { font:16px ui-monospace, Menlo, monospace; width:120px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; text-transform:uppercase; -webkit-user-select:text; user-select:text; }
  #hexin.bad { border-color:#c94a3b; }
  #hexprev { width:38px; height:38px; border-radius:8px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.14); flex:none; }
  #hexpick { width:38px; height:38px; padding:0; border:0; background:none; }
  .btn { padding:9px 14px; border-radius:9px; background:var(--soft); font-size:15px; }
  .btn.primary { background:var(--ink); color:#fff; }
  .ptitle { font-weight:600; margin-bottom:10px; }
  .check { display:flex; align-items:center; gap:8px; font-size:15px; }
  .check input { width:20px; height:20px; }
  #exportpop { right:max(14px, env(safe-area-inset-right)); width:300px; }
  #exp-img { display:block; max-width:100%; max-height:42vh; margin:12px auto 8px; border-radius:6px;
    background:repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0/16px 16px; -webkit-touch-callout:default; }
  .small { font-size:12px; color:var(--muted); }
  #palbtn { height:32px; display:flex; align-items:center; gap:2px; padding:0 6px 0 10px; border-radius:8px; background:var(--soft); font-size:14px; max-width:150px; }
  #palname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #palbtn svg { width:16px; height:16px; flex:none; }
  #palpop { width:300px; }
  .prow { display:flex; align-items:center; gap:6px; padding:4px; border-radius:9px; }
  .prow.on { background:var(--soft); }
  .prow .pick { flex:1; display:flex; align-items:center; gap:10px; text-align:left; padding:4px; min-width:0; }
  .prow .pick span.n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px; }
  .dots { display:flex; flex:none; }
  .dots i { width:14px; height:14px; border-radius:50%; margin-right:-4px; box-shadow:0 0 0 1.5px #fff, inset 0 0 0 1px rgba(0,0,0,.14); }
  .prow .mini { width:32px; height:32px; border-radius:8px; display:grid; place-items:center; color:var(--muted); flex:none; }
  .prow .mini svg { width:17px; height:17px; }
  .prow input { flex:1; font-size:16px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; min-width:0; -webkit-user-select:text; user-select:text; }
  #sub select { font-size:16px; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--soft); color:var(--ink); max-width:180px; }
  .vh { position:fixed; left:0; top:0; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none; }
  .bk { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  .bk .row { margin-top:10px; }
  #editor { position:fixed; z-index:3; margin:0; padding:0; border:0; background:transparent; resize:none; overflow:hidden;
    white-space:pre-wrap; overflow-wrap:break-word; outline:1.5px dashed var(--accent); outline-offset:6px; caret-color:var(--accent);
    -webkit-user-select:text; user-select:text; transform-origin:0 0; }
  #editor[hidden] { display:none; }
  #toast { position:fixed; z-index:20; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:9px 14px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="bar">
  <div class="group"><span class="lbl">Palette</span><button id="palbtn"><span id="palname"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg></button></div>
  <div class="sep"></div>
  <div class="group" data-group="pen"><span class="lbl">Pen</span><div class="sw"></div></div>
  <div class="group" data-group="background"><span class="lbl">Background</span><div class="sw"></div></div>
  <div class="group" data-group="shadow"><span class="lbl">Shadow</span><div class="sw"></div></div>
  <div class="sep"></div>
  <div class="icons">
    <button class="ib tool" data-tool="select" title="Select"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="13" height="13" rx="2" stroke-dasharray="3 2.6"/><path d="M12.5 12.5l7.5 2.8-3.3 1.4-1.4 3.3z" fill="currentColor"/></svg></button>
    <button class="ib tool" data-tool="nudge" title="Nudge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8" stroke-dasharray="3 2.6"/><path d="M8.5 12h7m-2.5-2.5 2.5 2.5-2.5 2.5"/></svg></button>
    <button class="ib tool" data-tool="text" title="Text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7V4.5h14V7M12 4.5v15M9 19.5h6"/></svg></button>
    <button class="ib tool" data-tool="eraser" title="Eraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20h10"/><path d="M14.3 4.6l5.1 5.1a1.5 1.5 0 0 1 0 2.1L11.2 20H7.6l-3-3a1.5 1.5 0 0 1 0-2.1z"/><path d="M9 10l5 5"/></svg></button>
  </div>
  <div class="spacer"></div>
  <div class="icons">
    <button class="ib" id="grid" title="Grid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/></svg></button>
    <button class="ib" id="undo" title="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.5 4.5 10 9 14.5"/><path d="M5 10h9a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="ib" id="redo" title="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5.5l4.5 4.5-4.5 4.5"/><path d="M19 10h-9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="ib" id="export" title="Export PNG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m-4 4 4-4 4 4"/><path d="M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg></button>
    <button class="ib" id="clear" title="Clear canvas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5"/></svg></button>
  </div>
</div>
<div id="sub" hidden></div>

<div id="hexpop" class="pop" hidden>
  <div class="row"><div id="hexprev"></div><input id="hexin" type="text" maxlength="7" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"><input id="hexpick" type="color" title="Colour picker"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" id="hexdel" style="color:#b23b2e;margin-right:auto">Delete</button><button class="btn" id="hexcancel">Cancel</button><button class="btn primary" id="hexok">Save</button></div>
</div>

<div id="palpop" class="pop" hidden>
  <div class="ptitle">Palettes</div>
  <div id="pallist"></div>
  <div class="row"><button class="btn" id="palnew">New palette</button></div>
  <div class="small" style="margin-top:8px">A new palette starts as a copy of the current one.</div>
</div>

<div id="exportpop" class="pop" hidden>
  <div class="ptitle" id="exp-title">Export drawing</div>
  <label class="check"><input type="checkbox" id="exp-bg"> Include background (#F9F9F9)</label>
  <div class="row"><button class="btn primary" id="exp-go">Create PNG</button><button class="btn" id="exp-close">Close</button></div>
  <div id="exp-result" hidden>
    <img id="exp-img" alt="Exported sketch">
    <div class="small">Press and hold the image to save or copy it.</div>
    <div class="row"><button class="btn primary" id="exp-save" hidden>Save PNG</button></div>
  </div>
  <div class="bk">
    <div class="ptitle" style="margin-bottom:4px">Backup</div>
    <div class="small">One file with your drawing, palettes and fonts. Keep it somewhere safe, such as Drive.</div>
    <div class="row" id="bk-btns"><button class="btn" id="bk-save">Save backup</button><label class="btn" for="bkfile" role="button" style="cursor:pointer">Restore backup</label></div>
    <div id="bk-confirm" hidden>
      <div class="small" id="bk-msg" style="color:var(--ink);margin-top:10px"></div>
      <div class="row"><button class="btn primary" id="bk-yes">Replace and restore</button><button class="btn" id="bk-no">Cancel</button></div>
    </div>
  </div>
</div>
<input type="file" id="bkfile" class="vh">
<div id="toast"></div>
<input type="file" id="fontfile" class="vh">
<textarea id="editor" spellcheck="false" hidden></textarea>

<script>
(() => {
'use strict';
const LAYERS = ['shadow', 'background', 'pen'];          // bottom → top
const PAPER = '#f9f9f9';
const PEN_W = 7, SHADOW_W = 79;
const ERASER = { S: 14, M: 40, L: 100 };                 // screen px
const MIN_S = 0.1, MAX_S = 12;
const STORE = 'sketchpad.v1';

let state = {
  palettes: [{ name: 'Palette 1', colours: { pen: ['#1f1f1f', '#ffffff'], background: ['#a9d8c0', '#f8d47a', '#f2a7a1'], shadow: ['#b893c7', '#d8d2cc'] } }],
  paletteIndex: 0,
  active: { pen: 0, background: 0, shadow: 0 },
  tool: 'pen', smoothing: 0.02, dashed: false, grid: true, eraserSize: 'M', nudgeSize: 'M', shadowFront: false,
  layerFor: { select: 'all', nudge: 'pen', eraser: 'pen' }, exportBg: true
};
let doc = { shadow: [], background: [], pen: [] };
let view = { x: 0, y: 0, s: 1 };

// ---------- persistence ----------
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (saved) {
    if (saved.state) {
      const s = saved.state;
      Object.assign(state, s);
      if (!Array.isArray(s.palettes) || !s.palettes.length) {
        state.palettes = [{ name: 'Palette 1', colours: s.palette || state.palettes[0].colours }];
        state.paletteIndex = 0;
      }
      delete state.palette;
      if (!state.palettes[state.paletteIndex]) state.paletteIndex = 0;
      state.layerFor = Object.assign({ select: 'all', nudge: 'pen', eraser: 'pen' }, s.layerFor || {});
    }
    if (saved.doc) for (const L of LAYERS) if (Array.isArray(saved.doc[L])) doc[L] = saved.doc[L];
    if (saved.view && isFinite(saved.view.s)) view = saved.view;
  }
} catch (e) {}
let saveTimer = 0, warned = false;
function writeSave() {
  saveTimer = 0;
  try { localStorage.setItem(STORE, JSON.stringify({ state, doc, view })); }
  catch (e) { if (!warned) { warned = true; toast("Couldn't autosave in this browser"); } }
}
// saving the whole drawing is the slow bit, so wait for a pause in drawing, and always save when the app is put away
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(writeSave, 1500); }
function flushSave() { if (saveTimer) { clearTimeout(saveTimer); writeSave(); } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });
addEventListener('pagehide', flushSave);

// ---------- history ----------
let undoStack = [], redoStack = [];
// snapshots share unchanged items; anything about to be edited in place is copied first (cow)
function snap() { return { shadow: doc.shadow.slice(), background: doc.background.slice(), pen: doc.pen.slice() }; }
function pushHistory() { undoStack.push(snap()); if (undoStack.length > 80) undoStack.shift(); redoStack = []; updateUndo(); }
function restore(sn) { doc = { shadow: sn.shadow.slice(), background: sn.background.slice(), pen: sn.pen.slice() }; sel = null; allDirty(); updateSub(); requestRender(); save(); updateUndo(); }
function undo() { if (!undoStack.length) return; redoStack.push(snap()); restore(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(snap()); restore(redoStack.pop()); }
function cow(L, op) { const i = doc[L].indexOf(op); if (i < 0) return op; const c = JSON.parse(JSON.stringify(op)); doc[L][i] = c; return c; }

// ---------- canvas setup ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true }) || canvas.getContext('2d');
// Only three off-screen canvases: everything below the layer you're working on, that layer, and everything above it.
// (Tablet browsers slow down sharply when a page holds many full-screen canvases.)
const below = document.createElement('canvas'), bctx = below.getContext('2d', { alpha: false });
const act = document.createElement('canvas'), actx = act.getContext('2d');
const above = document.createElement('canvas'), abctx = above.getContext('2d');
let dpr = 1, W = 0, H = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  for (const c of [canvas, below, act, above]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  positionSub(); allDirty(); requestRender();
}
const dirtyPasses = new Set(); let baseDirty = true, split = -1, aboveEmpty = true;
function allDirty() { baseDirty = true; }
function dirty(L) { PASSES.forEach((P, i) => { if (P.L === L) dirtyPasses.add(i); }); }
// draw order: shadow (behind), background, shadow in front of background, pen; erase ops apply to both shadow passes
const PASSES = [
  { key: 'shadow', L: 'shadow', f: op => !op.front },
  { key: 'background', L: 'background', f: op => op.kind !== 'text' },
  { key: 'shadowFront', L: 'shadow', f: op => op.front || op.kind === 'erase' },
  { key: 'pen', L: 'pen', f: op => op.kind !== 'text' },
  { key: 'text', L: 'pen', f: op => op.kind === 'text' && !(editing && editing.op === op) }   // text sits on top, untouched by the eraser
];
const passEmpty = PASSES.map(() => true);
function viewT(c) { c.setTransform(dpr * view.s, 0, 0, dpr * view.s, dpr * view.x, dpr * view.y); }
function toWorld(px, py) { return [(px - view.x) / view.s, (py - view.y) / view.s]; }
function toScreen(wx, wy) { return [wx * view.s + view.x, wy * view.s + view.y]; }
function viewChanged() { allDirty(); requestRender(); save(); if (editing) styleEditor(); }

// ---------- drawing ops ----------
function tracePath(c, p, closed) {
  const n = p.length / 2;
  c.beginPath(); c.moveTo(p[0], p[1]);
  if (n === 1) c.lineTo(p[0] + 0.01, p[1]);
  else if (n === 2) c.lineTo(p[2], p[3]);
  else {
    for (let i = 1; i < n - 1; i++) c.quadraticCurveTo(p[2*i], p[2*i+1], (p[2*i] + p[2*i+2]) / 2, (p[2*i+1] + p[2*i+3]) / 2);
    c.lineTo(p[2*n-2], p[2*n-1]);
  }
  if (closed) c.closePath();
}
const DEFAULT_FONT = '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
const fonts = [];   // {id, name, family}
function familyFor(id) { const f = fonts.find(f => f.id === id); return (f ? `"${f.family}", ` : '') + DEFAULT_FONT; }
const mctx = document.createElement('canvas').getContext('2d');
let layoutCache = new WeakMap();
function layoutText(op) {
  const key = op.text + '|' + op.bw + '|' + op.size + '|' + op.font + '|' + fonts.length;
  const hit = layoutCache.get(op); if (hit && hit.key === key) return hit.lines;
  mctx.font = `${op.size}px ${familyFor(op.font)}`;
  const fits = t => mctx.measureText(t).width <= op.bw;
  const lines = [];
  for (const para of op.text.split('\n')) {
    let line = '';
    for (let word of para.split(' ')) {
      const test = line ? line + ' ' + word : word;
      if (fits(test)) { line = test; continue; }
      if (line) { lines.push(line); line = ''; }
      while (word.length > 1 && !fits(word)) {
        let n = word.length - 1; while (n > 1 && !fits(word.slice(0, n))) n--;
        lines.push(word.slice(0, n)); word = word.slice(n);
      }
      line = word;
    }
    lines.push(line);
  }
  layoutCache.set(op, { key, lines });
  return lines;
}
function drawText(c, op) {
  c.globalCompositeOperation = 'source-over'; c.fillStyle = op.color; c.textBaseline = 'top';
  c.font = `${op.size}px ${familyFor(op.font)}`;
  const lines = layoutText(op), lh = op.size * op.lh, pad = (lh - op.size) / 2;
  lines.forEach((ln, i) => c.fillText(ln, op.pts[0], op.pts[1] + pad + i * lh));
}
function drawVariable(c, op) {
  const p = op.pts, w = op.ws;
  const n = p.length / 2;
  c.globalCompositeOperation = 'source-over'; c.fillStyle = op.color; c.beginPath();
  for (let i = 0; i < n; i++) { const x = p[2*i], y = p[2*i+1], rr = w[i] / 2; c.moveTo(x + rr, y); c.arc(x, y, rr, 0, Math.PI * 2); }
  for (let i = 0; i < n - 1; i++) {
    const x0 = p[2*i], y0 = p[2*i+1], x1 = p[2*i+2], y1 = p[2*i+3], L = Math.hypot(x1 - x0, y1 - y0);
    if (!L) continue;

  editor.style.height = 'auto'; editor.style.height = Math.max(editor.scrollHeight, op.size * op.lh) + 'px';
}
editor.addEventListener('input', () => { editing.op.text = editor.value; styleEditor(); });
editor.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); commitText(); } });
function commitText() {
  if (!editing) return;
  const { op, isNew, before, text } = editing; editing = null;
  editor.hidden = true; editor.blur();
  op.text = editor.value.replace(/\s+$/, '');
  const empty = !op.text.trim();
  if (isNew) { if (!empty) { pushHistory(); doc.pen.push(op); } }
  else if (empty) { undoStack.push(before); redoStack = []; doc.pen.splice(doc.pen.indexOf(op), 1); updateUndo(); }
  else if (op.text !== text) { undoStack.push(before); redoStack = []; updateUndo(); }
  dirty('pen'); save(); requestRender();
}

// ---------- fonts ----------
let idb = null;
function openDB() {
  return new Promise((res, rej) => {
    try {
      const rq = indexedDB.open('sketchpad-fonts', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('fonts', { keyPath: 'id' });
      rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
    } catch (e) { rej(e); }
  });
}
const fontBytes = {};   // id -> ArrayBuffer, for backups
async function registerFont(id, name, data) {
  const family = 'skf-' + id;
  try { const ff = new FontFace(family, data); await ff.load(); document.fonts.add(ff); fonts.push({ id, name, family }); return true; }
  catch (e) { return false; }
}
function fontsChanged() { layoutCache = new WeakMap(); allDirty(); if (state.tool === 'text') updateSub(); requestRender(); if (editing) styleEditor(); }
async function loadFonts() {
  try {
    idb = await openDB();
    const all = await new Promise((res, rej) => { const q = idb.transaction('fonts').objectStore('fonts').getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    for (const f of all) { if (await registerFont(f.id, f.name, f.data.slice(0))) fontBytes[f.id] = f.data; }
  } catch (e) {}
  fontsChanged();
}
document.getElementById('fontfile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if (!file) return;
  const data = await file.arrayBuffer();
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name = file.name.replace(/\.[^.]+$/, '');
  if (!(await registerFont(id, name, data.slice(0)))) { toast("That file doesn't look like a font I can read"); return; }
  fontBytes[id] = data;
  try {
    if (!idb) throw 0;
    await new Promise((res, rej) => { const tx = idb.transaction('fonts', 'readwrite'); tx.objectStore('fonts').put({ id, name, data }); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  } catch (_) { toast("Font added, but it couldn't be stored – it will be gone next time"); }
  state.palettes[state.paletteIndex].font = id; save(); fontsChanged();
  toast(`${name} added to ${state.palettes[state.paletteIndex].name}`);
});
sub.addEventListener('change', e => {
  if (e.target.id !== 'fontsel') return;
  state.palettes[state.paletteIndex].font = e.target.value || null; save();
});

// ---------- backup ----------
function toB64(buf) {
  const u = new Uint8Array(buf); let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
function fromB64(b64) { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }
function storeFont(id, name, data) {
  return new Promise(res => {
    try { if (!idb) return res(false); const tx = idb.transaction('fonts', 'readwrite'); tx.objectStore('fonts').put({ id, name, data }); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }
    catch (_) { res(false); }
  });
}
document.getElementById('bk-save').onclick = () => {
  if (editing) commitText();
  const used = fonts.filter(f => fontBytes[f.id]);
  const backup = { app: 'sketchpad', v: 1, saved: new Date().toISOString(), state, doc, view,
    fonts: used.map(f => ({ id: f.id, name: f.name, data: toB64(fontBytes[f.id]) })) };
  saveFile(new Blob([JSON.stringify(backup)], { type: 'application/json' }), `sketchpad-backup-${stamp()}.json`);
};
let pendingBackup = null;
const bkConfirm = document.getElementById('bk-confirm');
document.getElementById('bkfile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (_) { data = null; }
  if (!data || data.app !== 'sketchpad' || !data.state || !data.doc) { toast("That doesn't look like a Sketchpad backup"); return; }
  pendingBackup = data;
  const when = data.saved ? new Date(data.saved).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : 'an unknown date';
  const n = (data.state.palettes || []).length;
  document.getElementById('bk-msg').textContent = `Backup from ${when} with ${n} palette${n === 1 ? '' : 's'}. This replaces your current drawing and palettes.`;
  exportpop.hidden = false; bkConfirm.hidden = false;
});
document.getElementById('bk-no').onclick = () => { pendingBackup = null; bkConfirm.hidden = true; };
document.getElementById('bk-yes').onclick = async () => {
  const data = pendingBackup; pendingBackup = null; bkConfirm.hidden = true;
  if (!data) return;
  if (editing) commitText();
  for (const f of data.fonts || []) {
    if (fonts.some(x => x.id === f.id)) continue;
    try { const buf = fromB64(f.data); if (await registerFont(f.id, f.name, buf.slice(0))) { fontBytes[f.id] = buf; await storeFont(f.id, f.name, buf); } } catch (_) {}
  }
  const s2 = data.state;
  Object.assign(state, s2);
  state.layerFor = Object.assign({ select: 'all', nudge: 'pen', eraser: 'pen' }, s2.layerFor || {});
  if (!Array.isArray(state.palettes) || !state.palettes.length) state.palettes = [{ name: 'Palette 1', colours: { pen: ['#1f1f1f'], background: ['#a9d8c0'], shadow: ['#b893c7'] } }];
  if (!state.palettes[state.paletteIndex]) state.paletteIndex = 0;
  doc = { shadow: [], background: [], pen: [] };
  for (const L of LAYERS) if (Array.isArray(data.doc[L])) doc[L] = data.doc[L];
  if (data.view && isFinite(data.view.s)) view = data.view;
  undoStack = []; redoStack = []; sel = null;
  buildSwatches(); updateBar(); updateSub(); fontsChanged(); save(); closePops();
  toast('Backup restored');
};

// palettes
const palpop = document.getElementById('palpop'), pallist = document.getElementById('pallist');
let palEditing = -1, palConfirm = -1;
const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5l4 4L9 19H5v-4z"/></svg>';
const ICON_DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5"/></svg>';
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function renderPalettes() {
  document.getElementById('palname').textContent = state.palettes[state.paletteIndex].name;
  pallist.innerHTML = state.palettes.map((p, i) => {
    const dots = ['pen', 'background', 'shadow'].flatMap(g => p.colours[g]).map(c => `<i style="background:${c}"></i>`).join('');
    if (i === palEditing) return `<div class="prow on" data-i="${i}"><input value="${esc(p.name)}" maxlength="40" data-role="name"><button class="btn primary" data-role="ok">Save</button></div>`;
    const del = state.palettes.length > 1 ? (palConfirm === i
      ? `<button class="btn" data-role="del" style="color:#b23b2e;padding:6px 10px">Delete?</button>`
      : `<button class="mini" data-role="del" title="Delete">${ICON_DEL}</button>`) : '';
    return `<div class="prow ${i === state.paletteIndex ? 'on' : ''}" data-i="${i}"><button class="pick" data-role="pick"><span class="dots">${dots}</span><span class="n">${esc(p.name)}</span></button><button class="mini" data-role="edit" title="Rename">${ICON_EDIT}</button>${del}</div>`;
  }).join('');
  const inp = pallist.querySelector('input'); if (inp) { inp.focus(); inp.select(); }
}
function commitRename() {
  const inp = pallist.querySelector('input'); if (!inp) return;
  const v = inp.value.trim(); if (v) state.palettes[palEditing].name = v;
  palEditing = -1; save(); renderPalettes();
}
document.getElementById('palbtn').onclick = () => {
  if (!palpop.hidden) { closePops(); return; }
  closePops(); palEditing = -1; palConfirm = -1; renderPalettes();
  const r = document.getElementById('palbtn').getBoundingClientRect();
  palpop.style.left = Math.max(8, r.left - 6) + 'px'; palpop.style.top = (r.bottom + 12) + 'px';
  palpop.hidden = false;
};
pallist.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const i = +b.closest('.prow').dataset.i, role = b.dataset.role;
  if (role === 'pick') { state.paletteIndex = i; palConfirm = -1; buildSwatches(); save(); updateBar(); updateSub(); renderPalettes(); }
  else if (role === 'edit') { palEditing = i; palConfirm = -1; renderPalettes(); }
  else if (role === 'ok') commitRename();
  else if (role === 'del') {
    if (palConfirm !== i) { palConfirm = i; renderPalettes(); return; }
    state.palettes.splice(i, 1); setTimeout(() => { buildSwatches(); updateBar(); });
    if (state.paletteIndex >= i && state.paletteIndex > 0) state.paletteIndex--;
    palConfirm = -1; save(); updateBar(); renderPalettes();
  }
});
pallist.addEventListener('keydown', e => { if (e.key === 'Enter') commitRename(); if (e.key === 'Escape') { palEditing = -1; renderPalettes(); } });
document.getElementById('palnew').onclick = () => {
  const n = state.palettes.length + 1;
  state.palettes.push({ name: 'Palette ' + n, colours: JSON.parse(JSON.stringify(pal())), font: state.palettes[state.paletteIndex].font || null });
  state.paletteIndex = state.palettes.length - 1; palEditing = state.paletteIndex; palConfirm = -1;
  save(); updateBar(); renderPalettes();
};

function closePops() { hexpop.hidden = true; exportpop.hidden = true; palpop.hidden = true; }

let toastTimer = 0;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

// ---------- start ----------
buildSwatches(); updateBar(); updateSub(); loadFonts();
// offline support and protection against the browser clearing storage
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (_) {}
addEventListener('resize', resize);
resize();
})();
</script>
</body>
</html>
